<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiMo Chat</title>
<style>
:root{
  --bg:#faf9f5; --panel:#f0eee6; --card:#ffffff; --text:#1f1e1d; --muted:#6b6a68;
  --border:#e3e0d6; --accent:#c96442; --accent-h:#b5573a; --user:#efece2; --code:#2b2a28;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#262624; --panel:#1f1e1d; --card:#30302e; --text:#f0eee6; --muted:#9c9a92;
  --border:#3d3c39; --user:#34332f; --code:#1a1918;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,"Segoe UI",system-ui,sans-serif;display:flex}
#side{width:260px;background:var(--panel);border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
#side h1{font:600 20px Georgia,serif;margin:4px 6px 10px}
#side h1 span{color:var(--accent)}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px;text-align:left}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;text-align:center}
.btn.primary:hover{background:var(--accent-h)}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.chat-item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:6px}
.chat-item:hover,.chat-item.on{background:var(--border);color:var(--text)}
.chat-item .x{opacity:0;cursor:pointer}
.chat-item:hover .x{opacity:.7}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:none;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center;gap:10px}
header b{font-family:Georgia,serif}
#msgs{flex:1;overflow:auto;padding:24px 16px}
.wrap{max-width:760px;margin:0 auto}
#hello{text-align:center;margin-top:14vh}
#hello h2{font:400 36px Georgia,serif;margin:0 0 8px}
#hello h2 em{color:var(--accent);font-style:normal}
#hello p{color:var(--muted);margin:0}
.msg{margin:0 0 22px;display:flex;gap:12px}
.msg.user{justify-content:flex-end}
.msg.user .body{background:var(--user);padding:10px 16px;border-radius:18px;max-width:85%;white-space:pre-wrap}
.msg.ai .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;flex-shrink:0;margin-top:2px}
.msg.ai .body{flex:1;min-width:0;overflow-wrap:anywhere}
.body p{margin:0 0 12px}
.body h1,.body h2,.body h3{font-family:Georgia,serif;margin:16px 0 8px}
.body ul,.body ol{margin:0 0 12px;padding-left:24px}
.body a{color:var(--accent)}
.body code{background:var(--user);padding:1px 6px;border-radius:5px;font:13.5px ui-monospace,Menlo,Consolas,monospace}
.body pre{background:var(--code);color:#eee;border-radius:10px;padding:14px;overflow:auto;margin:0 0 12px;position:relative}
.body pre code{background:none;padding:0;color:inherit}
.copy{position:absolute;top:6px;right:8px;font-size:12px;background:#ffffff22;color:#ddd;border:0;border-radius:6px;padding:3px 8px;cursor:pointer}
.think{color:var(--muted);font-size:14px;border-left:2px solid var(--border);padding-left:12px;margin-bottom:10px;white-space:pre-wrap}
.cursor::after{content:"▍";color:var(--accent);animation:b 1s infinite}
@keyframes b{50%{opacity:0}}
#composer{padding:0 16px 18px}
#box{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:12px 14px;box-shadow:0 2px 12px #0000000d}
#box:focus-within{border-color:var(--accent)}
textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;max-height:200px;min-height:26px}
#bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
#model{font-size:13px;color:var(--muted)}
#send{width:34px;height:34px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer;font-size:18px}
#send:disabled{opacity:.4;cursor:default}
#foot{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
dialog{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:16px;padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:#0006}
dialog h3{margin:0 0 14px;font-family:Georgia,serif}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password],input[type=number]{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.err{color:#d9534f}
@media(max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:.2s}
  #side.open{transform:none;box-shadow:0 0 40px #0006}
  header{display:flex}
  #hello h2{font-size:28px}
}
</style>
</head>
<body>
<aside id="side">
  <h1><span>✻</span> MiMo</h1>
  <button class="btn primary" id="new">+ Yeni sohbet</button>
  <div id="list"></div>
  <button class="btn" id="settings">⚙ Ayarlar / API Anahtarı</button>
</aside>

<main>
  <header><button class="btn" id="menu">☰</button><b>MiMo</b></header>
  <div id="msgs"><div class="wrap" id="thread"></div></div>
  <div id="composer">
    <div id="box">
      <textarea id="input" rows="1" placeholder="Bir şey sor..."></textarea>
      <div id="bar"><span id="model"></span><button id="send" title="Gönder">↑</button></div>
    </div>
    <div id="foot">Yanıtlar hatalı olabilir. API anahtarın yalnızca tarayıcında saklanır.</div>
  </div>
</main>

<dialog id="dlg">
  <h3>Ayarlar</h3>
  <label>API Anahtarı</label>
  <input type="password" id="key" placeholder="sk-..." autocomplete="off">
  <label>API Adresi (OpenAI uyumlu)</label>
  <input type="text" id="base" placeholder="https://api.xiaomimimo.com/v1">
  <label>Model adı</label>
  <input type="text" id="mname" placeholder="mimo-v2.6-pro-ultraspeed">
  <label>Sistem istemi (isteğe bağlı)</label>
  <input type="text" id="sys" placeholder="Sen yardımsever bir asistansın.">
  <label>Sıcaklık (temperature)</label>
  <input type="number" id="temp" step="0.1" min="0" max="2">
  <div class="row">
    <button class="btn" id="cancel">Kapat</button>
    <button class="btn primary" id="save">Kaydet</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const LS = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k)) ?? d}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };

let cfg = Object.assign({ key:"", base:"https://api.xiaomimimo.com/v1", model:"mimo-v2.6-pro-ultraspeed", sys:"", temp:0.7 }, LS.get("cfg",{}));
let chats = LS.get("chats", []);
let cur = null, busy = false, ctrl = null;

const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function md(src){
  const blocks = [];
  src = src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (_,l,c)=>{ blocks.push(`<pre><button class="copy">Kopyala</button><code>${esc(c.replace(/\n$/,''))}</code></pre>`); return `\u0000${blocks.length-1}\u0000`; });
  let h = esc(src)
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  h = h.replace(/(?:^[-*] .*(?:\n|$))+/gm, m=>'<ul>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^[-*] /,'')+'</li>').join('')+'</ul>');
  h = h.replace(/(?:^\d+\. .*(?:\n|$))+/gm, m=>'<ol>'+m.trim().split('\n').map(l=>'<li>'+l.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>');
  h = h.split(/\n{2,}/).map(p=>/^\s*<(h\d|ul|ol|pre)|^\u0000/.test(p)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return h.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}

function save(){ LS.set("chats", chats); }
function curChat(){ return chats.find(c=>c.id===cur); }

function renderList(){
  $("#list").innerHTML = "";
  chats.slice().reverse().forEach(c=>{
    const d = document.createElement("div");
    d.className = "chat-item"+(c.id===cur?" on":"");
    d.innerHTML = `<span>${esc(c.title)}</span><span class="x" title="Sil">✕</span>`;
    d.onclick = e=>{
      if(e.target.classList.contains("x")){ chats = chats.filter(x=>x.id!==c.id); save(); if(cur===c.id) newChat(); else renderList(); return; }
      cur = c.id; renderList(); renderThread(); $("#side").classList.remove("open");
    };
    $("#list").appendChild(d);
  });
}

function msgEl(m, streaming){
  const d = document.createElement("div");
  d.className = "msg "+(m.role==="user"?"user":"ai");
  if(m.role==="user"){ d.innerHTML = `<div class="body">${esc(m.content)}</div>`; }
  else{
    const think = m.reasoning ? `<div class="think">${esc(m.reasoning)}</div>` : "";
    d.innerHTML = `<div class="av">✻</div><div class="body${streaming?" cursor":""}">${think}${md(m.content||"")}</div>`;
  }
  return d;
}

function renderThread(){
  const t = $("#thread"); t.innerHTML = "";
  const c = curChat();
  if(!c || !c.messages.length){
    t.innerHTML = `<div id="hello"><h2><em>✻</em> Merhaba, ne yapalım?</h2><p>${esc(cfg.model)} ile konuşuyorsun</p></div>`;
  } else c.messages.forEach(m=>t.appendChild(msgEl(m)));
  $("#msgs").scrollTop = 1e9;
}

function newChat(){
  const c = { id:uid(), title:"Yeni sohbet", messages:[] };
  chats.push(c); cur = c.id; save(); renderList(); renderThread();
  $("#side").classList.remove("open"); $("#input").focus();
}

async function send(){
  const input = $("#input"); const text = input.value.trim();
  if(busy){ ctrl && ctrl.abort(); return; }
  if(!text) return;
  if(!cfg.key){ openSettings(); return; }
  if(!curChat()) newChat();
  const c = curChat();
  if(!c.messages.length) c.title = text.slice(0,40);
  c.messages.push({role:"user", content:text});
  const ai = {role:"assistant", content:"", reasoning:""};
  c.messages.push(ai);
  input.value=""; input.style.height="auto";
  renderList(); renderThread();
  const t = $("#thread"); const el = t.lastElementChild; const body = el.querySelector(".body"); body.classList.add("cursor");
  busy = true; $("#send").textContent = "■"; ctrl = new AbortController();

  const msgs = [];
  if(cfg.sys) msgs.push({role:"system", content:cfg.sys});
  c.messages.slice(0,-1).forEach(m=>msgs.push({role:m.role, content:m.content}));

  const paint = ()=>{ body.innerHTML = (ai.reasoning?`<div class="think">${esc(ai.reasoning)}</div>`:"") + md(ai.content); const s=$("#msgs"); if(s.scrollHeight-s.scrollTop-s.clientHeight<160) s.scrollTop=1e9; };

  try{
    const r = await fetch(cfg.base.replace(/\/$/,"")+"/chat/completions", {
      method:"POST", signal:ctrl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
      body:JSON.stringify({ model:cfg.model, messages:msgs, stream:true, temperature:Number(cfg.temp) })
    });
    if(!r.ok){ throw new Error("HTTP "+r.status+" — "+(await r.text()).slice(0,300)); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf="";
    while(true){
      const {done,value} = await rd.read(); if(done) break;
      buf += dec.decode(value,{stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for(const ln of lines){
        const s = ln.trim(); if(!s.startsWith("data:")) continue;
        const p = s.slice(5).trim(); if(p==="[DONE]") continue;
        try{
          const d = JSON.parse(p).choices?.[0]?.delta || {};
          if(d.reasoning_content) ai.reasoning += d.reasoning_content;
          if(d.content) ai.content += d.content;
          paint();
        }catch{}
      }
    }
  }catch(e){
    if(e.name==="AbortError"){ ai.content += "\n\n*(durduruldu)*"; }
    else ai.content += `\n\n<span class="err">Hata: ${esc(e.message)}</span>`.replace(/<[^>]+>/g,"") + "\n\nİpucu: API adresini, model adını ve anahtarı Ayarlar'dan kontrol et. Tarayıcıdan doğrudan istek CORS nedeniyle engellenmiş olabilir.";
  }
  busy=false; ctrl=null; $("#send").textContent="↑"; body.classList.remove("cursor");
  paint(); save();
}

function openSettings(){
  $("#key").value=cfg.key; $("#base").value=cfg.base; $("#mname").value=cfg.model; $("#sys").value=cfg.sys; $("#temp").value=cfg.temp;
  $("#dlg").showModal();
}
function applyCfg(){ $("#model").textContent = cfg.model; }

$("#save").onclick = ()=>{
  cfg = { key:$("#key").value.trim(), base:$("#base").value.trim()||"https://api.xiaomimimo.com/v1", model:$("#mname").value.trim()||"mimo-v2.6-pro-ultraspeed", sys:$("#sys").value.trim(), temp:$("#temp").value||0.7 };
  LS.set("cfg",cfg); applyCfg(); $("#dlg").close(); if(!curChat()?.messages.length) renderThread();
};
$("#cancel").onclick = ()=>$("#dlg").close();
$("#settings").onclick = openSettings;
$("#new").onclick = newChat;
$("#menu").onclick = ()=>$("#side").classList.toggle("open");
$("#send").onclick = send;
$("#input").addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }});
$("#input").addEventListener("input", e=>{ e.target.style.height="auto"; e.target.style.height=Math.min(e.target.scrollHeight,200)+"px"; });
$("#thread").addEventListener("click", e=>{
  if(e.target.classList.contains("copy")){ const code=e.target.parentElement.querySelector("code").textContent; navigator.clipboard.writeText(code); e.target.textContent="Kopyalandı"; setTimeout(()=>e.target.textContent="Kopyala",1200); }
});

applyCfg();
if(!chats.length) newChat(); else { cur = chats[chats.length-1].id; renderList(); renderThread(); }
if(!cfg.key) setTimeout(openSettings, 300);
</script>
</body>
</html>
